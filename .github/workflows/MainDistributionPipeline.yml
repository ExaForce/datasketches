name: Main Extension Distribution Pipeline
# ExaForce fork: build only on pushes to build/** branches or when started by
# hand. No schedules, no pull request builds, no deploy to Query.Farm.
on:
  push:
    branches:
    - build/**
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{
    github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm/extension-ci-tools/.github/workflows/build.yml@query-farm
    with:
      duckdb_version: v2.0.0
      ci_tools_version: query-farm
      exclude_archs: 'windows_amd64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads'
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
